<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"
     aria-labelledby="pipeTitle pipeDesc" width="1200" height="470">
  <title id="pipeTitle">How a dictation travels from the key press to your cursor</title>
  <desc id="pipeDesc">Key down starts writing a WAV to disk immediately. Key up sends it to
  gemini-3.5-transcribe, an optional tone pass runs behind a validation gate, and the text is
  inserted through a three-step ladder: type into a confirmed text control, guarded paste, or
  leave it on the clipboard. Every session is written to History either way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <clipPath id="pipeRound">
      <rect x="0" y="0" width="1200" height="470" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pipeRound)">
    <rect width="1200" height="470" fill="#0E0F11"/>

    <text x="64" y="72" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, sans-serif"
          font-size="40" font-weight="600" fill="#F1F3F4">One dictation, end to end</text>

    <!-- Capture -->
    <g transform="translate(64 118)">
      <rect width="300" height="112" rx="14" fill="#1A1C1E" stroke="#3C4043"/>
      <text x="24" y="42" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" letter-spacing="2" fill="#4285F4">KEY DOWN</text>
      <text x="24" y="76" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="22" fill="#E8EAED">audio.wav on disk</text>
      <text x="24" y="100" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="20" fill="#9AA0A6">from millisecond zero</text>
    </g>
    <line x1="380" y1="174" x2="440" y2="174" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Transcribe -->
    <g transform="translate(452 118)">
      <rect width="316" height="112" rx="14" fill="#1A1C1E" stroke="#3C4043"/>
      <text x="24" y="42" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" letter-spacing="2" fill="#4285F4">KEY UP</text>
      <text x="24" y="76" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="22" fill="#E8EAED">gemini-3.5-transcribe</text>
      <text x="24" y="100" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="20" fill="#9AA0A6">your key, one host</text>
    </g>
    <line x1="784" y1="174" x2="844" y2="174" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gate -->
    <g transform="translate(856 118)">
      <rect width="280" height="112" rx="14" fill="#1A1C1E" stroke="#3C4043"/>
      <text x="24" y="42" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" letter-spacing="2" fill="#FBBC04">VALIDATION GATE</text>
      <text x="24" y="76" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="22" fill="#E8EAED">answered, not typed?</text>
      <text x="24" y="100" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="20" fill="#9AA0A6">fall back to the raw text</text>
    </g>

    <!-- The insertion ladder -->
    <text x="64" y="290" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="2.4" fill="#6B7075">THE INSERTION LADDER — IT NEVER BLIND-PASTES</text>

    <g transform="translate(64 310)">
      <rect width="344" height="96" rx="14" fill="#16211A" stroke="#34A853" stroke-opacity="0.55"/>
      <text x="24" y="38" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" fill="#34A853">1 · TYPE</text>
      <text x="24" y="70" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="21" fill="#E8EAED">into a UIA-confirmed field</text>
    </g>

    <g transform="translate(428 310)">
      <rect width="344" height="96" rx="14" fill="#1A1C1E" stroke="#3C4043"/>
      <text x="24" y="38" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" fill="#A8C7FA">2 · PASTE</text>
      <text x="24" y="70" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="21" fill="#E8EAED">clipboard restored after</text>
    </g>

    <g transform="translate(792 310)">
      <rect width="344" height="96" rx="14" fill="#1A1C1E" stroke="#3C4043"/>
      <text x="24" y="38" font-family="Cascadia Code, Consolas, SFMono-Regular, Menlo, monospace"
            font-size="19" fill="#9AA0A6">3 · HOLD</text>
      <text x="24" y="70" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            font-size="21" fill="#E8EAED">copied — press Ctrl+V</text>
    </g>

    <text x="64" y="440" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif"
          font-size="21" fill="#9AA0A6">Every outcome lands in History — including the ones that failed.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="20" fill="none" stroke="#2A2C2F" stroke-width="1"/>
</svg>
