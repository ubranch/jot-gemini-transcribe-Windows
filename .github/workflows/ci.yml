name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global RUSTFLAGS: `-D warnings` there applies to every
  # dependency too, so one warning inside GPUI would fail our build. The denial
  # belongs on our own lint step.

jobs:
  check:
    name: fmt · clippy · test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml, so there is exactly one
      # place that decides which compiler builds this.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Proves the shipping configuration compiles, including the
      # windows_subsystem attribute that only applies in release.
      - name: Release build
        run: cargo build --release -p jot --locked
