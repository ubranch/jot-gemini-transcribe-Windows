[workspace]
resolver = "2"
members = ["crates/jot-core", "crates/jot"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known", "macros", "local-offset"] }
tracing = "0.1"
